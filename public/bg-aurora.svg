<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100d35"/>
      <stop offset="0.5" stop-color="#4a2c8f"/>
      <stop offset="1" stop-color="#d95c9b"/>
    </linearGradient>
    <radialGradient id="a" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8dffe6" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8dffe6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc0e4" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffc0e4" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <ellipse cx="320" cy="240" rx="520" ry="360" fill="url(#a)" filter="url(#blur)">
    <animate attributeName="cx" values="320;420;320" dur="16s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1250" cy="760" rx="560" ry="360" fill="url(#b)" filter="url(#blur)">
    <animate attributeName="cy" values="760;680;760" dur="14s" repeatCount="indefinite"/>
  </ellipse>
  <path d="M-100 620 C 300 260, 680 920, 1080 460 S 1560 240, 1740 500"
        stroke="#a6fff0" stroke-width="120" fill="none" opacity="0.16" filter="url(#blur)"/>
  <path d="M-100 660 C 300 300, 680 960, 1080 500 S 1560 280, 1740 540"
        stroke="#ffffff" stroke-width="8" fill="none" opacity="0.24"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2">
    <ellipse cx="800" cy="500" rx="420" ry="180" transform="rotate(-18 800 500)"/>
    <ellipse cx="800" cy="500" rx="560" ry="240" transform="rotate(-18 800 500)"/>
  </g>
</svg>
